[project]
name = "stock-analysis-plugin"
version = "0.1.4"
description = "Hermes plugin for stock analysis, screening, and strategy backtesting across A/HK/US markets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = [
    "hermes-agent",
    "hermes-plugin",
    "ai-agent",
    "stock",
    "stock-analysis",
    "stock-market",
    "stock-screener",
    "backtest",
    "backtesting",
    "quantitative-finance",
    "quantitative-trading",
    "algorithmic-trading",
    "technical-analysis",
    "factor-investing",
    "a-shares",
    "hk-stocks",
    "us-stocks",
    "akshare",
    "yfinance",
    "tushare",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "akshare>=1.12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "jinja2>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/Weaxs/stock-analysis-plugin"
Repository = "https://github.com/Weaxs/stock-analysis-plugin"
Issues = "https://github.com/Weaxs/stock-analysis-plugin/issues"

[project.entry-points."hermes_agent.plugins"]
stock-analysis = "hermes:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes", "tools"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "skills"
"templates" = "templates"
"schemas" = "schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration_network and not integration_llm'"
markers = [
    "integration_network: real provider calls (akshare/yfinance/etc.) — needs network",
    "integration_llm: real LLM calls (DeepSeek/Anthropic) — needs API key and network",
]
