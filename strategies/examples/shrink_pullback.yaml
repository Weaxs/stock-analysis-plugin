name: "Shrink Pullback"
version: "1.0"
description: "缩量回调策略 — 上升趋势中缩量回踩MA20附近，放量反弹时买入"

parameters:
  stop_loss: -0.06
  take_profit: 0.15

entry:
  conditions:
    - indicator: "ma_diff"
      fast_period: 10
      slow_period: 20
      operator: ">"
      value: 0
    - indicator: "bollinger_position"
      period: 20
      operator: "<"
      value: 0.4
    - indicator: "rsi"
      period: 14
      operator: "<"
      value: 50
    - indicator: "volume_ratio"
      period: 5
      operator: ">"
      value: 1.2
  logic: "all"

exit:
  conditions:
    - indicator: "rsi"
      period: 14
      operator: ">"
      value: 75
    - indicator: "bollinger_position"
      period: 20
      operator: ">"
      value: 0.9
  logic: "any"
  stop_loss: "{stop_loss}"
  take_profit: "{take_profit}"

simulation:
  slippage: 0.001       # 滑点（买卖双边）
  commission: 0.00025   # 佣金（买卖双边，A股常见万2.5）
  stamp_tax: 0.0005     # 印花税（A股卖出单边；其他市场按当下实际费率，无则删除本行）

position:
  size: 1.0
  max_positions: 1
