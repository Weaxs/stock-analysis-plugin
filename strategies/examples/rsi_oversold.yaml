name: "RSI Oversold Bounce"
version: "1.0"
description: "RSI超卖反弹策略 — 当RSI跌至超卖区间时买入，升至超买区间时卖出"

parameters:
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  stop_loss: -0.05
  take_profit: 0.15

entry:
  conditions:
    - indicator: "rsi"
      period: "{rsi_period}"
      operator: "<"
      value: "{rsi_oversold}"
    - indicator: "volume_ratio"
      operator: ">"
      value: 1.0
  logic: "all"

exit:
  conditions:
    - indicator: "rsi"
      period: "{rsi_period}"
      operator: ">"
      value: "{rsi_overbought}"
  logic: "any"
  stop_loss: "{stop_loss}"
  take_profit: "{take_profit}"

simulation:
  slippage: 0.001       # 滑点（买卖双边）
  commission: 0.00025   # 佣金（买卖双边，A股常见万2.5）
  stamp_tax: 0.0005     # 印花税（A股卖出单边；其他市场按当下实际费率，无则删除本行）

position:
  size: 1.0
  max_positions: 1
