name: "Emotion Cycle Contrarian"
version: "1.0"
description: "情绪周期逆向策略 — RSI极度超卖+缩量+布林带底部时逆向买入"

parameters:
  rsi_extreme: 25
  rsi_exit: 60
  stop_loss: -0.07
  take_profit: 0.18

entry:
  conditions:
    - indicator: "rsi"
      period: 14
      operator: "<"
      value: "{rsi_extreme}"
    - indicator: "volume_ratio"
      period: 5
      operator: "<"
      value: 0.7
    - indicator: "bollinger_position"
      period: 20
      operator: "<"
      value: 0.1
  logic: "all"

exit:
  conditions:
    - indicator: "rsi"
      period: 14
      operator: ">"
      value: "{rsi_exit}"
    - indicator: "volume_ratio"
      period: 5
      operator: ">"
      value: 2.5
  logic: "any"
  stop_loss: "{stop_loss}"
  take_profit: "{take_profit}"

simulation:
  slippage: 0.001       # 滑点（买卖双边）
  commission: 0.00025   # 佣金（买卖双边，A股常见万2.5）
  stamp_tax: 0.0005     # 印花税（A股卖出单边；其他市场按当下实际费率，无则删除本行）

position:
  size: 0.5
  max_positions: 1
