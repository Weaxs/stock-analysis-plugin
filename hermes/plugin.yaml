name: stock-analysis
version: 0.1.0
description: "Stock analysis, screening, and strategy backtesting across A/HK/US markets"
provides_tools:
  - get_kline
  - get_quote
  - get_capital_flow
  - get_news
  - get_financials
  - get_technical_analysis
  - analyze_pattern
  - get_market_indices
  - get_sector_rankings
  - get_stock_info
  - get_chip_distribution
  - get_market_stats
  - get_fundamental_context
  - screen_stocks
  - run_backtest
  - evaluate_signal
  - resolve_stock_name
  - check_trading_day
  - get_trading_days
  - calculate_ma
  - get_volume_analysis
  - search_stock_news
  - search_comprehensive_intel
  - get_social_sentiment
  - get_trending_sentiment
  - extract_article
  - screen_risk
  - detect_market_regime
  - get_market_review
  - run_watchlist_analysis
  - detect_anomaly
  - diagnose_data_sources
  - get_market_capabilities
  - render_stock_report
  - render_market_report
  - build_watchlist_context
  - analyze_position_context
  - check_alert_rules
  - parse_stock_list
requires_env:
  - name: TAVILY_API_KEY
    description: "Tavily search API key (optional, one search engine is enough)"
    url: "https://tavily.com"
    secret: true
  - name: BRAVE_API_KEY
    description: "Brave search API key (optional)"
    url: "https://brave.com/search/api/"
    secret: true
  - name: SERPAPI_KEY
    description: "SerpAPI key (optional)"
    url: "https://serpapi.com"
    secret: true
  - name: BOCHA_API_KEY
    description: "Bocha AI search API key (optional)"
    secret: true
  - name: SENTIMENT_API_KEY
    description: "Social sentiment API key (optional, for Eastmoney + Xueqiu)"
    secret: true
  - name: SENTIMENT_API_URL
    description: "Sentiment API endpoint (default: https://api.adanos.org)"
    secret: false
  - name: FINNHUB_API_KEY
    description: "Finnhub API key (US stock quotes and financials)"
    url: "https://finnhub.io"
    secret: true
  - name: ALPHAVANTAGE_API_KEY
    description: "Alpha Vantage API key (US stock klines)"
    url: "https://www.alphavantage.co"
    secret: true
  - name: LONGBRIDGE_APP_KEY
    description: "Longbridge app key (HK stock quotes)"
    url: "https://open.longportapp.com"
    secret: true
  - name: LONGBRIDGE_APP_SECRET
    description: "Longbridge app secret"
    secret: true
  - name: LONGBRIDGE_ACCESS_TOKEN
    description: "Longbridge access token"
    secret: true
  - name: TUSHARE_TOKEN
    description: "Tushare token (A-share enhanced data, optional)"
    url: "https://tushare.pro"
    secret: true
requires_mcp:
  - name: wisburg-mcp-server
    description: "Wisburg research data — institutional reports, earnings calls, filings, market daily"
    url: "https://wisburg.com"
    optional: true
