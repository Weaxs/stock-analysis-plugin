name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# One active run per branch/PR — new pushes cancel stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python lint tools
        # Pinned — must match requirements-dev.txt and autofix.yml.
        run: pip install ruff==0.15.20

      - name: Ruff check
        run: ruff check tools/ skills/ tests/ hermes/

      - name: Ruff format check
        run: ruff format --check tools/ skills/ tests/ hermes/

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # --ignore-scripts: tsc doesn't need the postinstall-built Python venv.
      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript type check
        run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 leg guards the declared floor — verified: full dep set installs
        # and the suite passes on cpython 3.10.19.
        python-version: ["3.11", "3.10"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=tools --cov-report=term-missing

  network:
    # Real provider calls (akshare/yfinance) — flaky upstreams by nature, so
    # gated to same-repo PRs and pushes (forks skip it, like e2e-llm).
    # continue-on-error: see publish.yml — a flaky upstream must not block the
    # release path; failures still surface as annotations on the run.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install -r requirements-dev.txt

      - name: Network integration tests
        run: pytest tests/e2e/test_provider_network.py -m integration_network -v

  compat:
    # Cross-platform host↔python integration on the free runners. This is the
    # regression surface for OS-specific path bugs like #2 (Windows venv python
    # location, __dirname/baseDir resolution) that the ubuntu-only jobs above
    # structurally cannot see. Deterministic by design: no LLM, no secrets, and
    # the 4 round-trip tools are the non-network set (see tests/e2e/*.ts).
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # tests/conftest.py imports numpy/pandas at module load, so any pytest run
      # needs the tools' runtime deps in system python. npm ci's postinstall
      # separately builds .venv (full requirements) — that's the python the
      # host↔python round-trips spawn.
      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install -r requirements-dev.txt
          npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Pi extension registration (jiti load + skill paths)
        run: npx tsx tests/test_pi_integration.ts

      - name: OpenClaw plugin registration
        run: npx tsx tests/test_openclaw_integration.ts

      - name: dsh plugin registration
        run: npx tsx tests/test_dsh_integration.ts

      - name: Hermes plugin registration
        run: pytest tests/test_hermes_integration.py -v

      - name: Run host↔python round-trip tests
        run: pytest tests/e2e/test_host_to_python.py -v

      - name: Pi host real subprocess round-trip
        run: npx tsx tests/e2e/test_pi_e2e.ts

      - name: OpenClaw host real subprocess round-trip
        run: npx tsx tests/e2e/test_openclaw_e2e.ts

      - name: dsh host real subprocess round-trip
        run: npx tsx tests/e2e/test_dsh_e2e.ts

  e2e-llm:
    # Real DeepSeek call. Only runs when DEEPSEEK_API_KEY secret is present
    # (skipped on forks to prevent secret exposure).
    # continue-on-error: like `network` — non-deterministic output must not
    # block the release path (see publish.yml).
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install -r requirements-dev.txt

      # Full npm ci (postinstall builds .venv) — the Pi LLM flow spawns tools
      # through it.
      - name: Install Node dependencies
        run: npm ci

      - name: E2E — Hermes LLM flow
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY not configured — skipping LLM e2e"
            exit 0
          fi
          pytest tests/e2e/test_hermes_llm.py -m integration_llm -v

      - name: E2E — Pi LLM flow
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY not configured — skipping LLM e2e"
            exit 0
          fi
          npx tsx tests/e2e/test_pi_llm.ts

  e2e-host:
    # Real-host smoke: install the plugin into the actual pi / openclaw /
    # hermes / dsh runtime and run one QA turn through the host's own agent
    # loop. This is a BLOCKING check — the smoke script retries the QA
    # internally.
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        host: [pi, openclaw, hermes, dsh]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        # Node 24: openclaw requires >= 22.19, and pi 0.83's undici breaks on 20.x
        # (dsh also requires ^22.19 || >=24)
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies (also builds repo .venv via postinstall)
        run: npm ci

      - name: Install host CLIs
        # Pinned: pi latest and openclaw latest (slim repack) drifted from the
        # validated CLIs — openclaw@latest installed no working bin, and pi's
        # `list` flags changed between releases. dsh is a developer preview
        # (rc line), so pin it too. `dsh plugin` forwards to pnpm.
        # dsh 0.1.5-rc.3: 0.1.0-rc.7's patch-layer watcher is incompatible with
        # the floated cordis-plugin-hmr ≥1.0.19 (registerConfig API removed) and
        # crashed headless boots with "user patch-layer watching requires the
        # Cordis HMR service" (2026-09-23). rc-line transitive deps still float.
        run: |
          npm i -g @earendil-works/pi-coding-agent@0.83.0
          npm i -g openclaw@2026.6.33
          npm i -g @deepseek-ai/dsh@0.1.5-rc.3
          npm i -g pnpm@10

      - name: Real-host smoke QA (${{ matrix.host }})
        env:
          SMOKE_LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMOKE_LLM_BASE_URL: https://api.deepseek.com
          SMOKE_LLM_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
        run: |
          if [ -z "$SMOKE_LLM_API_KEY" ]; then
            echo "SMOKE_LLM_API_KEY not configured — failing (this check is blocking by design)"
            exit 1
          fi
          node tests/e2e/host_smoke.mjs ${{ matrix.host }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test, compat]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # --ignore-scripts: packing/bundling doesn't need the Python venv
      # (esbuild's binary arrives via optionalDependencies, not postinstall).
      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      # Bundle both compiled hosts here so esbuild breakage surfaces in CI
      # instead of at tag-publish time.
      - name: Build host bundles
        run: |
          npm run build:openclaw
          npm run build:dsh

      - name: Verify pack contents
        run: npm pack --dry-run

      - name: Build package
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: "*.tgz"
          retention-days: 7
