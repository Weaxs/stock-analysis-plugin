name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or resume
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ci is a whole-workflow reusable call — a caller cannot `needs` individual
  # jobs inside it, so the flaky jobs (network, e2e-llm) carry job-level
  # `continue-on-error: true` in ci.yml to keep them off the release path.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
    secrets: inherit

  publish-npm:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Sync version from tag
        run: bash scripts/sync-version.sh "$RELEASE_TAG"

      # --ignore-scripts: publishing only packs and uploads — no Python venv.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and verify
        run: npm pack --dry-run

      - name: Publish to npm
        run: |
          PACKAGE=$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')
          npm view "$PACKAGE" version --registry=https://registry.npmjs.org >/dev/null 2>&1 \
            || npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish unscoped variant to npm
        # Same payload under the unscoped name; users may install either.
        run: |
          npm pkg set name=stock-analysis-plugin
          PACKAGE=$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')
          npm view "$PACKAGE" version --registry=https://registry.npmjs.org >/dev/null 2>&1 \
            || npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync version from tag
        run: bash scripts/sync-version.sh "$RELEASE_TAG"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true

  publish-openclaw:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Sync version from tag
        run: bash scripts/sync-version.sh "$RELEASE_TAG"

      # --ignore-scripts: publishing only packs and uploads — no Python venv.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build compiled plugin entry (dist/index.js)
        run: npm run build:openclaw

      - name: Stage payload into openclaw/
        run: |
          set -euo pipefail
          for d in tools skills schemas templates strategies scripts; do
            if [ -d "$d" ]; then
              rm -rf "openclaw/$d"
              cp -R "$d" "openclaw/$d"
            fi
          done
          rm -f openclaw/scripts/sync-version.sh
          cp LICENSE openclaw/LICENSE

      # Guard against regression of the issue behind
      # https://github.com/Weaxs/stock-analysis-plugin/issues/3 — a TS entry
      # (./index.ts) with no compiled sibling makes registry installs fail.
      # The two publish paths ship dist/index.js differently, so assert both:
      #   - npm:     dist must survive the `files` whitelist into the tarball.
      #   - clawhub: it ships the ./openclaw directory, so dist must exist on disk.
      - name: Verify compiled entry is packaged
        working-directory: openclaw
        run: |
          npm pack --dry-run 2>&1 | tee pack-dry-run.txt
          grep -q "dist/index.js" pack-dry-run.txt \
            || { echo "::error::dist/index.js missing from openclaw npm tarball — build ran but files whitelist excludes dist/"; exit 1; }
          grep -q "LICENSE" pack-dry-run.txt \
            || { echo "::error::LICENSE missing from openclaw npm tarball"; exit 1; }
          test -f dist/index.js \
            || { echo "::error::openclaw/dist/index.js missing on disk — clawhub publish would ship no compiled entry"; exit 1; }

      - name: Install clawhub CLI
        # Pinned — an unpinned clawhub@latest broke a release before; bump deliberately.
        run: npm i -g clawhub@0.23.3

      - name: npm publish
        working-directory: openclaw
        run: |
          PACKAGE=$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')
          npm view "$PACKAGE" version --registry=https://registry.npmjs.org >/dev/null 2>&1 \
            || npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Authenticate clawhub CLI
        run: clawhub login --token "$CLAWHUB_TOKEN" --no-input
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Publish to ClawHub (dry-run)
        run: clawhub package publish ./openclaw --family bundle-plugin --dry-run

      - name: Publish to ClawHub
        run: |
          VERSION=$(node -p 'require("./openclaw/package.json").version')
          if clawhub package inspect @weaxs/openclaw-stock-analysis --version "$VERSION" --json >/dev/null 2>&1; then
            echo "ClawHub $VERSION already published"
          else
            clawhub package publish ./openclaw --family bundle-plugin
          fi

      - name: Publish unscoped variant to npm
        # Same payload under the unscoped name. Runs after ClawHub so the
        # manifest-facing name stays scoped for the clawhub publish.
        working-directory: openclaw
        run: |
          npm pkg set name=openclaw-stock-analysis
          PACKAGE=$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')
          npm view "$PACKAGE" version --registry=https://registry.npmjs.org >/dev/null 2>&1 \
            || npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-dsh:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Sync version from tag
        run: bash scripts/sync-version.sh "$RELEASE_TAG"

      # --ignore-scripts: publishing only packs and uploads — no Python venv.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build compiled plugin entry (dist/index.js)
        run: npm run build:dsh

      - name: Stage payload into dsh/
        run: |
          set -euo pipefail
          for d in tools skills schemas templates strategies scripts; do
            if [ -d "$d" ]; then
              rm -rf "dsh/$d"
              cp -R "$d" "dsh/$d"
            fi
          done
          rm -f dsh/scripts/sync-version.sh
          cp LICENSE dsh/LICENSE

      # Same regression guard as the OpenClaw job: the dsh profile loader
      # imports built JS, so dist must survive the `files` whitelist, and the
      # bundle manifest must ship its patch file.
      - name: Verify compiled entry and patch are packaged
        working-directory: dsh
        run: |
          npm pack --dry-run 2>&1 | tee pack-dry-run.txt
          grep -q "dist/index.js" pack-dry-run.txt \
            || { echo "::error::dist/index.js missing from dsh npm tarball — build ran but files whitelist excludes dist/"; exit 1; }
          grep -q "cordis.patch.yml" pack-dry-run.txt \
            || { echo "::error::cordis.patch.yml missing from dsh npm tarball — dsh bundle manifest would dangle"; exit 1; }
          grep -q "LICENSE" pack-dry-run.txt \
            || { echo "::error::LICENSE missing from dsh npm tarball"; exit 1; }

      - name: npm publish
        working-directory: dsh
        run: |
          PACKAGE=$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')
          npm view "$PACKAGE" version --registry=https://registry.npmjs.org >/dev/null 2>&1 \
            || npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish unscoped variant to npm
        # The bundle manifest references the plugin by package name, so the
        # unscoped variant's patch (and README install command) must name the
        # unscoped package — otherwise a profile installing it would resolve
        # the scoped name at boot and fail.
        working-directory: dsh
        run: |
          npm pkg set name=dsh-stock-analysis
          sed -i 's|@weaxs/dsh-stock-analysis|dsh-stock-analysis|g' cordis.patch.yml README.md
          grep -q 'name: "dsh-stock-analysis"' cordis.patch.yml
          PACKAGE=$(node -p 'const p = require("./package.json"); p.name + "@" + p.version')
          npm view "$PACKAGE" version --registry=https://registry.npmjs.org >/dev/null 2>&1 \
            || npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    runs-on: ubuntu-latest
    needs: [publish-npm, publish-pypi, publish-openclaw, publish-dsh]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Compose install footer
        run: |
          VERSION="${RELEASE_TAG#v}"
          cat > install_footer.md <<EOF

          ---
          ### Install

          - **npm**: \`npm install @weaxs/stock-analysis-plugin@${VERSION}\`
          - **pip**: \`pip install stock-analysis-plugin==${VERSION}\`
          - **OpenClaw**: \`openclaw plugins install clawhub:@weaxs/openclaw-stock-analysis\`
          - **dsh**: \`dsh plugin --profile <name> add @weaxs/dsh-stock-analysis\`
          - 非 scoped 同名变体（内容一致）：\`stock-analysis-plugin\` / \`openclaw-stock-analysis\` / \`dsh-stock-analysis\`
          EOF

      - name: Create GitHub Release
        # --generate-notes uses .github/release.yml for PR categorization and
        # automatically appends author @mentions, PR numbers, and a Full
        # Changelog compare link. We append our install footer via --notes-file
        # after the fact, since --generate-notes and --notes-file are exclusive.
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --generate-notes
          # Fetch the generated body, append install footer, update the release
          GENERATED=$(gh release view "${RELEASE_TAG}" --json body --jq .body)
          {
            echo "$GENERATED"
            cat install_footer.md
          } > final_notes.md
          gh release edit "${RELEASE_TAG}" --notes-file final_notes.md
        env:
          GH_TOKEN: ${{ github.token }}
