name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python lint tools
        run: pip install ruff>=0.4.0

      - name: Ruff check
        run: ruff check tools/ skills/ tests/ hermes/

      - name: Ruff format check
        run: ruff format --check tools/ skills/ tests/ hermes/

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm install

      - name: TypeScript type check
        run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=tools --cov-report=term-missing

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm install

      - name: Test Pi extension registration
        run: npx tsx tests/test_pi_integration.ts

      - name: Test OpenClaw plugin registration
        run: npx tsx tests/test_openclaw_integration.ts

  publish-npm:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Build and verify
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  publish-openclaw:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Stage payload into openclaw/
        run: |
          set -euo pipefail
          for d in tools skills schemas strategies scripts; do
            if [ -d "$d" ]; then
              rm -rf "openclaw/$d"
              cp -R "$d" "openclaw/$d"
            fi
          done

      - name: Install clawhub CLI
        run: npm i -g clawhub

      - name: npm publish
        working-directory: openclaw
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Authenticate clawhub CLI
        run: clawhub login --token "$CLAWHUB_TOKEN" --no-input
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Publish to ClawHub (dry-run)
        working-directory: openclaw
        run: clawhub package publish weaxs/stock-analysis --dry-run

      - name: Publish to ClawHub
        working-directory: openclaw
        run: clawhub package publish weaxs/stock-analysis

  github-release:
    runs-on: ubuntu-latest
    needs: [publish-npm, publish-pypi, publish-openclaw]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" HEAD)
          else
            LOG=$(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD)
          fi
          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md
          echo "$LOG" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "**npm**: \`npm install @weaxs/stock-analysis-plugin@${GITHUB_REF_NAME#v}\`" >> release_notes.md
          echo "**pip**: \`pip install stock-analysis-plugin==${GITHUB_REF_NAME#v}\`" >> release_notes.md
          echo "**OpenClaw**: \`openclaw plugins install clawhub:weaxs/stock-analysis\`" >> release_notes.md

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ github.token }}
