name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python lint tools
        run: pip install ruff>=0.4.0

      - name: Ruff check
        run: ruff check tools/ skills/ tests/ hermes/

      - name: Ruff format check
        run: ruff format --check tools/ skills/ tests/ hermes/

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm install

      - name: TypeScript type check
        run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r tools/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=tools --cov-report=term-missing

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm install

      - name: Test Pi extension registration
        run: npx tsx tests/test_pi_integration.ts

      - name: Test OpenClaw plugin registration
        run: npx tsx tests/test_openclaw_integration.ts

  publish-npm:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Sync version from tag
        run: bash scripts/sync-version.sh

      - name: Install dependencies
        run: npm install

      - name: Build and verify
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync version from tag
        run: bash scripts/sync-version.sh

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  publish-openclaw:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Sync version from tag
        run: bash scripts/sync-version.sh

      - name: Install dependencies
        run: npm install

      - name: Build compiled plugin entry (dist/index.js)
        run: npm run build:openclaw

      - name: Stage payload into openclaw/
        run: |
          set -euo pipefail
          for d in tools skills schemas templates strategies scripts; do
            if [ -d "$d" ]; then
              rm -rf "openclaw/$d"
              cp -R "$d" "openclaw/$d"
            fi
          done

      # Guard against regression of the issue behind
      # https://github.com/Weaxs/stock-analysis-plugin/issues/3 — a TS entry
      # (./index.ts) with no compiled sibling makes registry installs fail.
      # The two publish paths ship dist/index.js differently, so assert both:
      #   - npm:     dist must survive the `files` whitelist into the tarball.
      #   - clawhub: it ships the ./openclaw directory, so dist must exist on disk.
      - name: Verify compiled entry is packaged
        working-directory: openclaw
        run: |
          npm pack --dry-run 2>&1 | tee pack-dry-run.txt
          grep -q "dist/index.js" pack-dry-run.txt \
            || { echo "::error::dist/index.js missing from openclaw npm tarball — build ran but files whitelist excludes dist/"; exit 1; }
          test -f dist/index.js \
            || { echo "::error::openclaw/dist/index.js missing on disk — clawhub publish would ship no compiled entry"; exit 1; }

      - name: Install clawhub CLI
        run: npm i -g clawhub

      - name: npm publish
        working-directory: openclaw
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Authenticate clawhub CLI
        run: clawhub login --token "$CLAWHUB_TOKEN" --no-input
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Publish to ClawHub (dry-run)
        run: clawhub package publish ./openclaw --dry-run

      - name: Publish to ClawHub
        run: clawhub package publish ./openclaw

  github-release:
    runs-on: ubuntu-latest
    needs: [publish-npm, publish-pypi, publish-openclaw]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compose install footer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > install_footer.md <<EOF

          ---
          ### Install

          - **npm**: \`npm install @weaxs/stock-analysis-plugin@${VERSION}\`
          - **pip**: \`pip install stock-analysis-plugin==${VERSION}\`
          - **OpenClaw**: \`openclaw plugins install clawhub:@weaxs/openclaw-stock-analysis\`
          EOF

      - name: Create GitHub Release
        # --generate-notes uses .github/release.yml for PR categorization and
        # automatically appends author @mentions, PR numbers, and a Full
        # Changelog compare link. We append our install footer via --notes-file
        # after the fact, since --generate-notes and --notes-file are exclusive.
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
          # Fetch the generated body, append install footer, update the release
          GENERATED=$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body)
          {
            echo "$GENERATED"
            cat install_footer.md
          } > final_notes.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file final_notes.md
        env:
          GH_TOKEN: ${{ github.token }}
