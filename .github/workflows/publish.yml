name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ci is a whole-workflow reusable call — a caller cannot `needs` individual
  # jobs inside it, so the flaky jobs (network, e2e-llm) carry job-level
  # `continue-on-error: true` in ci.yml to keep them off the release path.
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish-npm:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Sync version from tag
        run: bash scripts/sync-version.sh

      # --ignore-scripts: publishing only packs and uploads — no Python venv.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and verify
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish unscoped variant to npm
        # Same payload under the unscoped name; users may install either.
        run: |
          npm pkg set name=stock-analysis-plugin
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Sync version from tag
        run: bash scripts/sync-version.sh

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

  publish-openclaw:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Sync version from tag
        run: bash scripts/sync-version.sh

      # --ignore-scripts: publishing only packs and uploads — no Python venv.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build compiled plugin entry (dist/index.js)
        run: npm run build:openclaw

      - name: Stage and verify OpenClaw package
        run: node .github/scripts/prepare-host-package.mjs openclaw

      - name: Install clawhub CLI
        # Pinned — an unpinned clawhub@latest broke a release before; bump deliberately.
        run: npm i -g clawhub@0.23.3

      - name: npm publish
        working-directory: openclaw
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Authenticate clawhub CLI
        run: clawhub login --token "$CLAWHUB_TOKEN" --no-input
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      # ClawHub still registers this package as bundle-plugin. Since the
      # registry tightened bundle validation (openclaw/clawhub#4031), that family
      # needs a bundle manifest we don't ship, and family changes need an admin
      # repair (openclaw/clawhub#4086, #4100). Until the row is migrated to
      # code-plugin, a ClawHub failure must not block the npm twin or the
      # GitHub release.
      - name: Publish to ClawHub (dry-run)
        id: clawhub-dry-run
        continue-on-error: true
        run: clawhub package publish ./openclaw --family bundle-plugin --dry-run

      - name: Publish to ClawHub
        id: clawhub-publish
        if: steps.clawhub-dry-run.outcome == 'success'
        continue-on-error: true
        run: clawhub package publish ./openclaw --family bundle-plugin

      - name: Warn when ClawHub was skipped
        if: steps.clawhub-publish.outcome != 'success'
        run: echo "::warning::ClawHub publish did not complete; the registry row still needs the bundle-plugin -> code-plugin repair (openclaw/clawhub#4086)"

      - name: Publish unscoped variant to npm
        # Same payload under the unscoped name. Runs after ClawHub so the
        # manifest-facing name stays scoped for the clawhub publish.
        working-directory: openclaw
        run: |
          npm pkg set name=openclaw-stock-analysis
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-dsh:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Sync version from tag
        run: bash scripts/sync-version.sh

      # --ignore-scripts: publishing only packs and uploads — no Python venv.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build compiled plugin entry (dist/index.js)
        run: npm run build:dsh

      - name: Stage and verify dsh package
        run: node .github/scripts/prepare-host-package.mjs dsh

      - name: npm publish
        working-directory: dsh
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Prepare and verify unscoped dsh package
        # The bundle manifest references the plugin by package name, so the
        # unscoped variant's patch and browser module id must name the unscoped
        # package — otherwise a profile installing it would resolve the scoped name
        # at boot and fail. README already documents the unscoped name first.
        run: node .github/scripts/prepare-host-package.mjs dsh --unscoped

      - name: Publish unscoped variant to npm
        working-directory: dsh
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    runs-on: ubuntu-latest
    needs: [publish-npm, publish-pypi, publish-openclaw, publish-dsh]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compose install footer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > install_footer.md <<EOF

          ---
          ### Install

          - **npm**: \`npm install @weaxs/stock-analysis-plugin@${VERSION}\`
          - **pip**: \`pip install stock-analysis-plugin==${VERSION}\`
          - **OpenClaw**: \`openclaw plugins install clawhub:@weaxs/openclaw-stock-analysis\`
          - **dsh**: \`dsh plugin --profile <name> add @weaxs/dsh-stock-analysis\`
          - 非 scoped 同名变体（内容一致）：\`stock-analysis-plugin\` / \`openclaw-stock-analysis\` / \`dsh-stock-analysis\`
          EOF

      - name: Create GitHub Release
        # --generate-notes uses .github/release.yml for PR categorization and
        # automatically appends author @mentions, PR numbers, and a Full
        # Changelog compare link. We append our install footer via --notes-file
        # after the fact, since --generate-notes and --notes-file are exclusive.
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
          # Fetch the generated body, append install footer, update the release
          GENERATED=$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body)
          {
            echo "$GENERATED"
            cat install_footer.md
          } > final_notes.md
          gh release edit "${GITHUB_REF_NAME}" --notes-file final_notes.md
        env:
          GH_TOKEN: ${{ github.token }}
