name: Recover v0.2.3 release

on:
  workflow_dispatch:

jobs:
  publish-missing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.2.3
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Sync version from tag
        run: GITHUB_REF_NAME=v0.2.3 bash scripts/sync-version.sh

      - name: Build Python package
        run: pip install build && python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}

      - name: Build OpenClaw package
        run: |
          npm ci --ignore-scripts
          npm run build:openclaw
          for d in tools skills schemas templates strategies scripts; do
            if [ -d "$d" ]; then
              cp -R "$d" "openclaw/$d"
            fi
          done
          rm -f openclaw/scripts/sync-version.sh
          cp LICENSE openclaw/LICENSE

      - name: Publish to ClawHub
        run: |
          npx -y clawhub@0.23.3 login --token "$CLAWHUB_TOKEN" --no-input
          npx -y clawhub@0.23.3 package publish ./openclaw --family bundle-plugin --dry-run
          npx -y clawhub@0.23.3 package publish ./openclaw --family bundle-plugin
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

      - name: Publish unscoped OpenClaw package to npm
        working-directory: openclaw
        run: |
          npm pkg set name=openclaw-stock-analysis
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: |
          gh release create v0.2.3 --title v0.2.3 --generate-notes
          cat > install_footer.md <<'EOF'

          ---
          ### Install

          - **npm**: `npm install @weaxs/stock-analysis-plugin@0.2.3`
          - **pip**: `pip install stock-analysis-plugin==0.2.3`
          - **OpenClaw**: `openclaw plugins install clawhub:@weaxs/openclaw-stock-analysis`
          - **dsh**: `dsh plugin --profile <name> add @weaxs/dsh-stock-analysis`
          - 非 scoped 同名变体（内容一致）：`stock-analysis-plugin` / `openclaw-stock-analysis` / `dsh-stock-analysis`
          EOF
          gh release edit v0.2.3 --notes "$(gh release view v0.2.3 --json body --jq .body)$(cat install_footer.md)"
        env:
          GH_TOKEN: ${{ github.token }}
